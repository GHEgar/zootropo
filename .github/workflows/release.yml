name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.5.0
        required: true

permissions:
  contents: write
  id-token: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Tag and package.json agree
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: Release notes from the changelog
        run: awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on' docs/CHANGELOG.md > notes.md
      - name: GitHub release
        run: gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "zootropo ${TAG#v}" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
      - name: npm, with trusted publishing
        run: npm view "zootropo@${TAG#v}" version > /dev/null 2>&1 || npm publish --provenance --access public

  github-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@ghegar'
      - run: npm ci
      - run: npm run build
      - run: npm pkg set name=@ghegar/zootropo
      - name: GitHub Packages
        run: npm view "@ghegar/zootropo@${TAG#v}" version > /dev/null 2>&1 || npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
